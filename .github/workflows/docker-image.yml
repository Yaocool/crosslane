name: Build and publish Docker image

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crosslane

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify release tag matches Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "release tag $GITHUB_REF_NAME does not match workspace version ${actual:-<missing>}" >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=semver,pattern={{raw}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime-full
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_VERSION=1.97.1
            CARGO_BUILD_JOBS=2
          cache-from: type=gha,scope=runtime-full
          cache-to: type=gha,mode=max,scope=runtime-full

  promote:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: crosslane-ghcr-aliases
      queue: max

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote published image tags by version
        shell: bash
        run: |
          set -euo pipefail
          image="$REGISTRY/$(tr '[:upper:]' '[:lower:]' <<< "$IMAGE_NAME")"
          minor="${GITHUB_REF_NAME%.*}"
          versions=$(skopeo list-tags --retry-times 3 \
            --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" "docker://$image" \
            | jq -r '.Tags[] | select(test("^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$"))' \
            | LC_ALL=C sort -Vr)

          if ! grep -Fxq -- "$GITHUB_REF_NAME" <<< "$versions"; then
            echo "Published release tag $GITHUB_REF_NAME is missing from GHCR" >&2
            exit 1
          fi

          IFS= read -r latest <<< "$versions"
          if [[ "$latest" == "$minor."* ]]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:latest" --tag "$image:$minor" "$image:$latest"
          else
            latest_patch=$(awk -v prefix="$minor." 'index($0, prefix) == 1 {print; exit}' <<< "$versions")
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:latest" "$image:$latest"
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:$minor" "$image:$latest_patch"
          fi
