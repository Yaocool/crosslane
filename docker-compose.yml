name: crosslane

services:
  crosslaned:
    # Production deployments pull a prebuilt image. Source builds live in
    # docker-compose.build.yml so a normal `docker compose up` cannot compile
    # on the server by accident.
    image: "${CROSSLANE_IMAGE:-ghcr.io/yaocool/crosslane:latest}"
    # Share the host network so proxy services created on arbitrary ports become
    # reachable from the host immediately, without recreating the container.
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    mem_limit: "${CROSSLANE_MEMORY_LIMIT:-1g}"
    pids_limit: ${CROSSLANE_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: "${CROSSLANE_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${CROSSLANE_DOCKER_LOG_MAX_FILES:-5}"
    labels:
      io.crosslane.role: daemon
    volumes:
      - crosslane-data:/var/lib/crosslane
    environment:
      RUST_LOG: info
      # Legacy Kiro enterprise environment fallback. Prefer admin kiro configure:
      # encrypted credentials persist in crosslane-data and hot-apply without recreation.
      CROSSLANE_KIRO_ADMIN_ACCESS_KEY_ID: ${CROSSLANE_KIRO_ADMIN_ACCESS_KEY_ID:-}
      CROSSLANE_KIRO_ADMIN_SECRET_ACCESS_KEY: ${CROSSLANE_KIRO_ADMIN_SECRET_ACCESS_KEY:-}
      CROSSLANE_KIRO_ADMIN_SESSION_TOKEN: ${CROSSLANE_KIRO_ADMIN_SESSION_TOKEN:-}
      CROSSLANE_KIRO_ADMIN_REGION: ${CROSSLANE_KIRO_ADMIN_REGION:-us-east-1}
      CROSSLANE_KIRO_ADMIN_PROFILE_ARN: ${CROSSLANE_KIRO_ADMIN_PROFILE_ARN:-}
      CROSSLANE_KIRO_ADMIN_APPLICATION_ARN: ${CROSSLANE_KIRO_ADMIN_APPLICATION_ARN:-}
      CROSSLANE_KIRO_ADMIN_IDENTITY_CENTER_REGION: ${CROSSLANE_KIRO_ADMIN_IDENTITY_CENTER_REGION:-}

volumes:
  crosslane-data:
