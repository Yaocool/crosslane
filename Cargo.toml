[workspace]
members = [
    "crates/crosslane-core",
    "crates/crosslane-provider",
    "crates/crosslane-copilot",
    "crates/crosslane-store",
    "crates/crosslane-ipc",
    "crates/crosslane-translate",
    "crates/crosslane-kiro",
    "crates/crosslane-pool",
    "crates/crosslane-notify",
    "crates/crosslaned",
    "crates/crosslane",
]
resolver = "2"

[workspace.package]
version = "2.1.2"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
crosslane-core = { path = "crates/crosslane-core" }
crosslane-provider = { path = "crates/crosslane-provider" }
crosslane-copilot = { path = "crates/crosslane-copilot" }
crosslane-store = { path = "crates/crosslane-store" }
crosslane-ipc = { path = "crates/crosslane-ipc" }
crosslane-translate = { path = "crates/crosslane-translate" }
crosslane-kiro = { path = "crates/crosslane-kiro" }
crosslane-pool = { path = "crates/crosslane-pool" }
crosslane-notify = { path = "crates/crosslane-notify" }
anyhow = "=1.0.86"
aho-corasick = "=1.1.5"
thiserror = "=1.0.63"
serde = { version = "=1.0.209", features = ["derive"] }
serde_json = "=1.0.127"
toml = "=0.8.19"
toml_edit = "=0.22.20"
tokio = { version = "=1.40.0", features = ["full"] }
tokio-util = { version = "=0.7.11", features = ["rt"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "json"] }
clap = { version = "=4.5.16", features = ["derive", "env"] }
clap_complete = "=4.5.24"
dotenvy = "=0.15.7"
chromiumoxide = { version = "=0.9.1", default-features = false }
notify = "=6.1.1"
notify-debouncer-full = "=0.3.2"
rand = "=0.8.5"
ring = "=0.17.14"
regex = "=1.13.1"
fancy-regex = "=0.12.0"
uuid = { version = "=1.10.0", features = ["v4"] }
tempfile = "=3.12.0"
async-stream = "=0.3.5"
async-trait = "=0.1.82"
axum = { version = "=0.7.5", features = ["json", "macros"] }
axum-server = { version = "=0.6.0", features = ["tls-rustls"] }
base64 = "=0.22.1"
bytes = "=1.9.0"
crc32fast = "=1.4.2"
dashmap = "=6.0.1"
flate2 = "=1.0.33"
futures = "=0.3.30"
hmac = "=0.12.1"
home = "=0.5.9"
http = "=1.1.0"
hyper = "=1.6.0"
hyper-util = "=0.1.12"
h2 = "=0.4.7"
hyper-rustls = { version = "=0.27.2", default-features = false }
indexmap = { version = "=2.6.0", features = ["serde"] }
lru = "=0.12.4"
libc = "=0.2.189"
reqwest = { version = "=0.12.7", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustc-hash = "=2.0.0"
rustls = { version = "=0.23.20", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "=1.10.1"
rustls-webpki = { version = "=0.102.8", default-features = false, features = ["ring"] }
quinn = { version = "=0.11.6", default-features = false }
quinn-proto = { version = "=0.11.9", default-features = false }
quinn-udp = { version = "=0.5.9", default-features = false }
sha2 = "=0.10.8"
shlex = "=2.0.1"
tokio-stream = { version = "=0.1.16", features = ["sync"] }
tiktoken-rs = "=0.5.9"
tower = { version = "=0.5.3", features = ["limit", "timeout", "util"] }
url = "=2.5.2"
webpki-roots = "=0.26.7"
zeroize = "=1.8.1"
proptest = "=1.5.0"
wiremock = "=0.6.2"
